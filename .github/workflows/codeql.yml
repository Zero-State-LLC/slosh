name: CodeQL

on:
  push:
  pull_request:

permissions:
  contents: read
  security-events: write
  packages: read

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      - name: Analyze
        uses: github/codeql-action/analyze@v3
